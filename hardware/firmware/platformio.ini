; 墨水屏课表牌固件 · 微雪 ESP32-C6-ePaper-1.54
;
; PlatformIO 工程配置。用命令行就能编：
;     pio run                 # 编译
;     pio run -t upload       # 编译并烧录（板子用 Type-C 连电脑）
;     pio device monitor      # 看串口日志
;
; 下面这个平台地址不是官方那条 `platform = espressif32`：
; ESP32-C6 需要 Arduino-ESP32 3.x 内核，官方平台还停在 2.0.x，装不了。
; 这里用的是社区维护的 pioarduino 分支包（版本锁定，别人拿到也一样能编）。

[env:waveshare-c6-epaper-154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; 板载 16MB Flash（devkitc-1 的定义是 8MB，这里按实物改回来）
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = time

; Serial 走 USB-CDC（C6 上必须开，不然串口没输出）
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    zinggjm/GxEPD2@^1.6.3
